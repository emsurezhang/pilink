# PiLink 公网入口（ECS Nginx）——私有 CA 方案（2026-10 实际部署）
# 链路：手机 ──HTTPS──▶ 本 Server:8443 ──▶ 127.0.0.1:17788(frps, 仅回环)
#        ──TLS隧道──▶ Mac frpc ──▶ Mac Nginx:7787 ──▶ Gateway:7788
# 证书：PiLink Local CA 签发（SAN=IP 101.200.193.92），手机需已信任该 CA
#       （Mac 上 ~/.pilink/certs/lan/ 管理，重签见 deploy/nginx/README.md）

server {
    listen 8443 ssl;
    server_name 101.200.193.92;

    ssl_certificate     /etc/pilink/certs/pilink-ecs.pem;   # cert + key 同文件
    ssl_certificate_key /etc/pilink/certs/pilink-ecs.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=86400" always;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:17788;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        # WS 长连接：空闲超时放宽（presence ping 25s）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# ── 备选：公网 CA 方案（Let's Encrypt）────────────────────────────
# 若有域名，建议改用 LE 证书（免装 CA）：ssl_certificate 换成
# /etc/letsencrypt/live/<domain>/fullchain.pem 等，server_name 换域名。
# 纯 IP（无域名）可用 LE short-lived IP 证书（约 6 天，需自动化续期，见运维手册）。
